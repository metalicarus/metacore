name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # A CLI compila com release 25 (ADR 0001); no Java 21 só a biblioteca é verificada.
      - name: mvn verify
        run: |
          if [ "${{ matrix.java }}" = "21" ]; then
            mvn -B -ntp verify -pl '!metacore-cli'
          else
            mvn -B -ntp verify
          fi
