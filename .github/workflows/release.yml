name: release

# Ao enviar uma tag v*, gera o executável da CLI em Linux, macOS e Windows e anexa
# os pacotes a um release em rascunho no GitHub (docs/release.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft \
                 --title "MetaCore ${GITHUB_REF_NAME#v}" \
                 --notes "Mudanças em CHANGELOG.md."

  cli:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build app image
        run: mvn -B -ntp -Pdist package -pl metacore-cli -am -DskipTests

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          name="metacore-${GITHUB_REF_NAME#v}-${os}-${arch}"
          cd metacore-cli/target/dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../$name.zip" . > /dev/null
            file="../$name.zip"
          else
            tar czf "../$name.tar.gz" .
            file="../$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$file" --clobber
