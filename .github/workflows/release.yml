name: release

# Ao enviar uma tag v*, gera o executável da CLI em Linux, macOS e Windows e anexa
# os pacotes a um release em rascunho no GitHub (docs/release.md). O disparo manual
# gera de novo os pacotes de uma tag existente, por exemplo quando um runner faltou.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag do release (por exemplo, v0.1.0)
        required: true
      os:
        description: Sistema a gerar
        type: choice
        options: [todos, ubuntu-latest, macos-latest, windows-latest]
        default: todos

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag \
                 --title "MetaCore ${TAG#v}" \
                 --notes "Mudanças em CHANGELOG.md."

  cli:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os && inputs.os != 'todos') && format('["{0}"]', inputs.os) || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build app image
        run: mvn -B -ntp -Pdist package -pl metacore-cli -am -DskipTests

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          name="metacore-${TAG#v}-${os}-${arch}"
          cd metacore-cli/target/dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../$name.zip" . > /dev/null
            file="../$name.zip"
          else
            tar czf "../$name.tar.gz" .
            file="../$name.tar.gz"
          fi
          gh release upload "$TAG" "$file" --clobber
